<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" 
        content="width=device-width", initial-scale="1.0">
        <title>Parágrafos</title>
    </head>
<body>
    <h1>Parágrafos e quebra de linha</h1>
    <hr>
    <p>Você 
        pode 
        escrever 
        um 
        parágrafo 
        de 
        qualquer 
        jeito.</p>
    <p>Necessitando quebrar o texto, usa-se a tag &lt;br&gt;.
        <br> &lt;br&gt; Esse é um teste.
        <br> &lt;br&gt; Outro 
        <br> &lt;br&gt; teste.
        <br> &lt;br&gt; O
        <br> &lt;br&gt; l
        <br> &lt;br&gt; á
        <br> &lt;br&gt; !  <!-- &lt; significa LESS THAN. -->
                           <!-- &gt; significa GREATER THAN. -->
    </p>
    <p>Perceba que, foi utilizado o mesmo parágrafo 
        em todas as mensagens acima. Diferente deste!
    </p>
</body>
</html>
